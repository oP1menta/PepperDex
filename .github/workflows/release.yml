# Builds the Windows and Linux packages. Push a tag like v1.0.0 to publish them in Releases.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux }
          - { os: windows-latest, name: Windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        shell: bash
        run: bash packaging/build.sh
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf PTU-Mestre-Linux.tar.gz PTU-Mestre
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/PTU-Mestre -DestinationPath PTU-Mestre-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PTU-Mestre-${{ matrix.name }}
          path: PTU-Mestre-${{ matrix.name }}.*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
